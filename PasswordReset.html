<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REP — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0f0e0d; --ink-3: #7a7672; --ink-4: #b5b0a8;
    --paper: #f5f2ed;
    --accent: #c8410a; --accent-h: #b33808;
    --green: #2a6b3c; --green-bg: #f0f9f3;
    --red: #a32020; --red-bg: #fdf0f0; --red-bd: rgba(163,32,32,.2);
    --border: rgba(15,14,13,.12);
    --r: 4px; --rl: 8px; --rxl: 12px;
    --fd: 'Syne', sans-serif; --fb: 'DM Sans', sans-serif;
  }
  body {
    font-family: var(--fb);
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
  }
  .card {
    background: #fff;
    border-radius: var(--rxl);
    padding: 36px;
    width: 100%;
    max-width: 400px;
  }
  .logo { font-family: var(--fd); font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .logo em { color: var(--accent); font-style: normal; }
  .subtitle { font-size: 14px; color: var(--ink-3); margin-bottom: 28px; }
  .field { margin-bottom: 14px; }
  .field-lbl {
    font-size: 11px; font-weight: 500; letter-spacing: .4px;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px;
    display: block;
  }
  input[type=password] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: var(--r); background: var(--paper);
    font-family: var(--fb); font-size: 14px; color: var(--ink);
    outline: none; transition: border-color .15s;
  }
  input[type=password]:focus { border-color: var(--accent); background: #fff; }
  input::placeholder { color: var(--ink-4); }
  .btn {
    width: 100%; padding: 11px; border-radius: var(--r);
    font-family: var(--fb); font-size: 14px; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
    margin-top: 4px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover:not(:disabled) { background: var(--accent-h); }
  .error-box {
    background: var(--red-bg); border: 1px solid var(--red-bd);
    border-radius: var(--rl); padding: 12px 14px;
    color: var(--red); font-size: 13px; margin-bottom: 16px;
    display: none;
  }
  .success-box {
    background: var(--green-bg); border: 1px solid #b8e0c5;
    border-radius: var(--rl); padding: 18px;
    color: var(--green); font-size: 14px;
    text-align: center; display: none;
  }
  .success-box strong { display: block; font-size: 16px; margin-bottom: 6px; }
  .rule {
    font-size: 11px; color: var(--ink-3); margin-top: 3px;
    display: flex; align-items: center; gap: 4px;
  }
  .rule.ok { color: var(--green); }
  .rule.fail { color: var(--red); }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .back-link {
    display: block; text-align: center; margin-top: 18px;
    font-size: 13px; color: var(--ink-3); text-decoration: none;
  }
  .back-link:hover { color: var(--ink); }
  /* Invalid token state */
  .invalid-token {
    text-align: center; display: none;
    color: var(--ink-3);
  }
  .invalid-token .icon { font-size: 32px; margin-bottom: 12px; opacity: .4; }
  .invalid-token p { font-size: 14px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">REP<em>.</em></div>
  <div class="subtitle" id="card-subtitle">Set a new password for your account</div>

  <!-- Shown when token is missing or expired -->
  <div class="invalid-token" id="invalid-token-state">
    <div class="icon">&#9888;</div>
    <p>This reset link is invalid or has expired.<br>Password reset links are single-use and expire after 1 hour.</p>
    <a href="/index.html" style="display:inline-block;padding:10px 20px;background:var(--ink);color:#fff;border-radius:4px;text-decoration:none;font-size:13px;font-weight:500">
      Back to App
    </a>
  </div>

  <!-- Reset form -->
  <div id="reset-form">
    <div class="error-box" id="err-box"></div>

    <div class="field">
      <label class="field-lbl" for="new-pass">New Password</label>
      <input type="password" id="new-pass" placeholder="Min 8 characters" autocomplete="new-password" oninput="validatePasswords()"/>
      <div class="rule" id="rule-length">Must be at least 8 characters</div>
    </div>

    <div class="field">
      <label class="field-lbl" for="confirm-pass">Confirm Password</label>
      <input type="password" id="confirm-pass" placeholder="Repeat password" autocomplete="new-password" oninput="validatePasswords()"/>
      <div class="rule" id="rule-match">Passwords must match</div>
    </div>

    <button class="btn btn-accent" id="submit-btn" onclick="submitReset()" disabled>
      Update Password
    </button>

    <!-- Success state replaces form -->
    <div class="success-box" id="success-box">
      <strong>Password updated!</strong>
      Redirecting you to the app…
    </div>
  </div>

  <a href="/index.html" class="back-link">← Back to app</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── CONFIG ───────────────────────────────────────────────────
// IMPORTANT: Must match the values in your index.html exactly.
const SUPABASE_URL  = 'https://iphktskgsprpypuokqkk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwaGt0c2tnc3BycHlwdW9rcWtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NTU3NDAsImV4cCI6MjA5MjQzMTc0MH0.hCfIo6vnVL5XEv_47gRNL7UraX9FKswgpEnnuPkn4Vg';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── WHY THIS WORKS ───────────────────────────────────────────
// Supabase recovery emails send a link like:
//   https://yoursite.com/reset-password.html#access_token=xxx&type=recovery
//
// When the Supabase JS SDK initialises on this page, it reads the
// URL hash automatically via onAuthStateChange, which fires a
// PASSWORD_RECOVERY event. We use that event to confirm the token
// is valid before showing the form.
//
// We do NOT manually parse the hash — the SDK handles it.

let recoverySessionReady = false;

// Listen for the PASSWORD_RECOVERY event from the SDK
// This fires when the SDK parses a valid #type=recovery hash
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    // Token is valid — user is temporarily signed in as themselves
    // so we can call updateUser()
    recoverySessionReady = true;
    document.getElementById('invalid-token-state').style.display = 'none';
    document.getElementById('reset-form').style.display = 'block';
  }
});

// Fallback: if no hash params at all, show the invalid state after
// a short delay (enough time for the SDK to fire the event if valid)
setTimeout(() => {
  if (!recoverySessionReady) {
    const hash = window.location.hash;
    const params = new URLSearchParams(hash.replace('#', '?'));
    const type = params.get('type');

    if (type !== 'recovery') {
      // No valid recovery token present
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('invalid-token-state').style.display = 'block';
      document.getElementById('card-subtitle').textContent = 'Reset link issue';
    }
  }
}, 500);

// ── VALIDATION ───────────────────────────────────────────────
function validatePasswords() {
  const pass    = document.getElementById('new-pass').value;
  const confirm = document.getElementById('confirm-pass').value;
  const btn     = document.getElementById('submit-btn');
  const ruleLen = document.getElementById('rule-length');
  const ruleMatch = document.getElementById('rule-match');

  const lenOk   = pass.length >= 8;
  const matchOk = pass === confirm && pass.length > 0;

  ruleLen.className   = 'rule ' + (lenOk ? 'ok' : (pass.length > 0 ? 'fail' : ''));
  ruleLen.textContent = lenOk ? '✓ At least 8 characters' : 'Must be at least 8 characters';

  ruleMatch.className   = 'rule ' + (matchOk ? 'ok' : (confirm.length > 0 ? 'fail' : ''));
  ruleMatch.textContent = matchOk ? '✓ Passwords match' : 'Passwords must match';

  btn.disabled = !(lenOk && matchOk);
}

// ── SUBMIT ───────────────────────────────────────────────────
async function submitReset() {
  const pass   = document.getElementById('new-pass').value;
  const btn    = document.getElementById('submit-btn');
  const errBox = document.getElementById('err-box');

  errBox.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Updating…';

  const { error } = await sb.auth.updateUser({ password: pass });

  if (error) {
    errBox.textContent  = error.message;
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Update Password';
    return;
  }

  // Success — show confirmation then redirect
  document.getElementById('new-pass').closest('.field').style.display = 'none';
  document.getElementById('confirm-pass').closest('.field').style.display = 'none';
  btn.style.display = 'none';
  document.getElementById('success-box').style.display = 'block';

  // Sign out so the user lands on a clean auth state at the main app
  await sb.auth.signOut();

  setTimeout(() => {
    window.location.href = '/index.html';
  }, 2000);
}
</script>
</body>
</html>
